name: nifti-qc

services:
  app:
    build: .
    image: nifti-sampler:1.0.0
    environment:
      PORT: "8000"
    ports:
      # Host port is configurable: NIFTI_HOST_PORT=9000 docker compose up app
      - "${NIFTI_HOST_PORT:-8000}:8000"
    healthcheck:
      # Covers service readiness: /healthz only returns 200 after the
      # startup self-check of the sampling pipeline has passed.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  verify:
    image: nifti-sampler:1.0.0
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      VERIFY_BASE_URL: "http://app:8000"
    command: ["python", "-m", "verify.verify"]
    restart: "no"
